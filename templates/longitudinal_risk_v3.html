<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>癌症风险纵向评估</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(135deg, #34495e 0%, #2bb673 100%);
    min-height: 100vh;
    padding: 40px 20px;
    color: #2c3e50;
}
.container { max-width: 960px; margin: 0 auto; }
.card { background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); overflow: hidden; }
.header { background: linear-gradient(135deg, #34495e 0%, #2bb673 100%); color: #fff; padding: 36px 40px; }
.header h1 { font-size: 26px; font-weight: 600; }
.header .meta { margin-top: 12px; font-size: 13px; opacity: 0.9; display: flex; gap: 20px; flex-wrap: wrap; }
.section { padding: 28px 40px; border-top: 1px solid #f0f3f6; }
.section h2 { font-size: 17px; padding-left: 12px; border-left: 4px solid #2bb673; margin-bottom: 14px; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
.summary-card { background: #f8f9fa; padding: 14px; border-radius: 10px; }
.summary-card .label { font-size: 12px; color: #888; }
.summary-card .value { font-size: 22px; font-weight: 600; color: #2c3e50; margin-top: 6px; }
.cancer-card { border: 1px solid #e1e8ef; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
.cancer-card h3 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.trend-pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.trend-pill.increasing { background: #f8d7da; color: #842029; }
.trend-pill.decreasing { background: #d4edda; color: #155724; }
.trend-pill.stable      { background: #e2e3e5; color: #495057; }
.trend-pill.single_point, .trend-pill.snapshot_only { background: #fff3cd; color: #856404; }
.trend-pill.no_history  { background: #f0f3f6; color: #6c757d; }
.history-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.history-table th { background: #f8f9fa; padding: 8px 10px; text-align: left; border-bottom: 2px solid #dee2e6; font-weight: 600; }
.history-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
.muted { color: #888; font-size: 12.5px; }
.disclaimer { background: #fff3cd; color: #856404; padding: 16px 18px; border-radius: 10px; font-size: 12.5px; line-height: 1.7; margin: 6px 40px 28px; }
.empty-note { padding: 12px 14px; background: #f8f9fa; border-radius: 8px; color: #6c757d; font-size: 13px; }
.footer { text-align: center; padding: 20px; color: #fff; font-size: 12.5px; opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <h1>📈 癌症风险纵向评估</h1>
      <div class="meta">
        <span>性别：__PERSON_SEX__</span>
        <span>年龄：__PERSON_AGE__ 岁</span>
        <span>评估日期：__GENERATED_AT__</span>
        <span>分析对象：所有可计算 posterior 的癌种</span>
      </div>
    </div>

    <div class="section">
      <h2>一、纵向分析总览</h2>
      __SUMMARY_GRID__
    </div>

    <div class="section">
      <h2>二、各癌种风险演变</h2>
      __CANCER_CARDS__
    </div>

    <div class="disclaimer">
      <strong>⚠️ 重要提示：</strong>__DISCLAIMER__
    </div>
  </div>
  <div class="footer">报告生成：__GENERATED_AT__ · CancerRisk v3</div>
</div>
</body>
</html>
