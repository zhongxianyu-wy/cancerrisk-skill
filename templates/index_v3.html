<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CancerRisk 报告中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    min-height: 100vh;
    padding: 40px 20px;
    color: #2c3e50;
}
.container { max-width: 800px; margin: 0 auto; }
.card { background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden; }
.header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: #fff; padding: 36px 40px; }
.header h1 { font-size: 26px; font-weight: 600; }
.header .meta { margin-top: 12px; font-size: 13px; opacity: 0.92; display: flex; gap: 18px; flex-wrap: wrap; }
.section { padding: 24px 40px; border-top: 1px solid #f0f3f6; }
.section h2 { font-size: 16px; padding-left: 12px; border-left: 4px solid #38ef7d; margin-bottom: 12px; }
.report-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.report-card { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border: 1px solid #e1e8ef; border-radius: 12px; text-decoration: none; color: inherit; }
.report-card:hover { box-shadow: 0 4px 14px rgba(17,153,142,0.18); transform: translateY(-1px); }
.report-card .name { font-size: 15px; font-weight: 600; }
.report-card .desc { font-size: 12.5px; color: #777; margin-top: 4px; }
.report-card .arrow { font-size: 20px; color: #11998e; }
.report-card.missing { background: #f8f9fa; color: #b0b0b0; pointer-events: none; }
.report-card.missing .arrow { color: #b0b0b0; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.summary-card { background: #f8f9fa; padding: 12px 14px; border-radius: 10px; }
.summary-card .label { font-size: 11.5px; color: #888; }
.summary-card .value { font-size: 18px; font-weight: 600; margin-top: 4px; }
.status-pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.status-pill.success { background: #d4edda; color: #155724; }
.status-pill.partial { background: #fff3cd; color: #856404; }
.status-pill.fail    { background: #f8d7da; color: #842029; }
.disclaimer { background: #fff3cd; color: #856404; padding: 16px 18px; border-radius: 10px; font-size: 12.5px; line-height: 1.7; margin: 6px 40px 28px; }
.footer { text-align: center; padding: 20px; color: #fff; font-size: 12.5px; opacity: 0.9; }
.muted { color: #888; font-size: 12.5px; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <h1>🧬 CancerRisk 报告中心</h1>
      <div class="meta">
        <span>运行：__RUN_ID__</span>
        <span>状态：__STATUS_PILL__</span>
        <span>生成时间：__GENERATED_AT__</span>
        <span>证据库版本：__EVIDENCE_VERSION__</span>
      </div>
    </div>

    <div class="section">
      <h2>运行摘要</h2>
      __SUMMARY_GRID__
    </div>

    <div class="section">
      <h2>报告入口</h2>
      <div class="report-grid">
        __REPORT_CARDS__
      </div>
    </div>

    <div class="section">
      <h2>质量与审计</h2>
      __QUALITY_BODY__
    </div>

    <div class="disclaimer">
      <strong>⚠️ 重要提示：</strong>__DISCLAIMER__
    </div>
  </div>
  <div class="footer">CancerRisk v3 · 入口页不重复业务结论，所有详情见对应报告</div>
</div>
</body>
</html>
